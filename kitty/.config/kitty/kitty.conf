font_family      JetBrains Mono
font_size        16.0
symbol_map       U+EFC5 Iosevka Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Cursor trail {{{
# Trail fires only after the cursor has rested this long (ms). Low values fire
# on every keystroke, which reads as noise; 25 keeps it for deliberate jumps.
cursor_trail 25
# Fade-out window in seconds, fast (short jumps) to slow (long jumps).
cursor_trail_decay 0.08 0.35
# Cells the cursor must move before a trail is drawn at all.
cursor_trail_start_threshold 2
# none = the trail inherits the cursor colour, so it re-tints itself whenever
# matugen regenerates colors.conf from a new wallpaper. Keep it as none.
cursor_trail_color none
# theme-lightning: shader/pipeline in ~/.config/kitty/shaders/. Kitty's stock
# lightning shader, but with the hardcoded orange/red swapped for the live theme
# colour, so the bolt always matches the serpantinum/matugen palette.
custom_shaders theme-lightning
# }}}

background_opacity 1.0
confirm_os_window_close 0

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no
hide_window_decorations yes

window_padding_width 4

include ~/.config/kitty/colors.conf
